# pytest configuration for JARVIS.
#
# testpaths is load-bearing, not a convenience. `vendor/` holds vendored
# third-party projects (deep-eye and its own 236-file test suite), which need
# their own virtualenv and their own dependencies. Left unrestricted, pytest
# collects their tests, they fail to import against JARVIS's interpreter, and
# the whole suite aborts during collection — which is exactly what happened
# the first time deep-eye was cloned: `pytest` reported 0 passed instead of
# running, and every mutation check afterwards looked like "no test detected
# it" because nothing had run at all.
#
# Deep Eye's own suite is run deliberately, with its own interpreter:
#   vendor/deep-eye/.deep-venv/Scripts/python.exe -m pytest vendor/deep-eye/tests
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
norecursedirs = vendor .venv .deep-venv .git scratch *.egg-info build dist
